name: Daily Stock Scraper

on:
  repository_dispatch:
    types: [run_scraper_am, run_scraper_pm] # 구글이 노크할 때 반응할 이름
  workflow_dispatch: # 직접 누를 때 작동

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 내려받기
      uses: actions/checkout@v4

    - name: 파이썬 3.10 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치 (yfinance 및 구글 전송용)
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests

    - name: 데이터 수집 및 구글 문서(WebHook)로 전송
      env:
        DOCS_WEBHOOK_URL: ${{ secrets.DOCS_WEBHOOK_URL }}
      run: python collect_close_prices.py
