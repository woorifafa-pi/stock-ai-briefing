name: Daily Stock Scraper

on:
  schedule:
    - cron: '0 8 * * 1-5' # 월~금 KST 17:00
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        python -m pip install --upgrade pip
        pip install finance-datareader pandas
    - run: python collect_close_prices.py
    - name: txt 파일을 깃허브에 누적 저장
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add 정기_종목종가_모니터링.txt
        git commit -m "📈 일일 주식 종가 업데이트" || echo "No changes"
        git push
